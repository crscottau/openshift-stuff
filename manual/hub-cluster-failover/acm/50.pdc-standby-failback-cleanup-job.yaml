#
# prepare ACM on the PDC/Standby cluster for fail back to ACM on the SDC/Active cluster
#
kind: Job
apiVersion: batch/v1
metadata:
  name: standby-failback-cleanup
  namespace: open-cluster-management-backup
spec:
  completions: 1
  template:
    metadata:
      creationTimestamp: null
    spec:
      containers:
        - name: standby-failback-cleanup
          #image: 'quay-image-registry.apps.hub-sdc.mgmt.cicz.gov.au/proxy-registry-redhat-io/openshift4/ose-cli:latest'
          image: 'registry.redhat.io/openshift4/ose-cli:v4.15'
          command:
            - /bin/bash
            - '-c'
            - |
              set -euo pipefail

              echo "Delete the BackupSchedule"
              oc -n open-cluster-management-backup delete backupschedule schedule-acm --ignore-not-found

              echo "Deleting the ManagedCluster resources"
              for _MC in $(oc get managedcluster -l local-cluster!=true -o name)
              do 
                echo ${_MC}
                oc delete ${_MC} --ignore-not-found
              done
          resources:
            requests:
              cpu: 10m
              memory: 50Mi
      restartPolicy: Never
      serviceAccountName: hub-cluster-failover-common-sa
