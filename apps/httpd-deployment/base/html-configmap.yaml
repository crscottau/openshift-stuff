apiVersion: v1
kind: ConfigMap
metadata:
  name: htmlstuff
data:
  index.html: |
    <html>
    <head>
    <title>Hello OpenShift</title>
      <style>
      * {
          font-family: Arial, sans-serif;
          box-sizing: border-box;
      }
      body {
          background-color: #d3d3d3;
          border: 2px solid #000;
          margin: 10px;
          padding: 20px;
          min-height: calc(100vh - 20px);
      }
      h1, h2, h3, h4, h5, h6 {
          color: blue;
      }
    </style>
    </head>
    <body>
    <h4>Exciting</h4>
    <p>Really, really exciting!</p>
    </body>
    </html>
    
